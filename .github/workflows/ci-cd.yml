name: CI-CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vitalsync-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/vitalsync-frontend

jobs:
  lint_test:
    name: Lint & Tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build_push:
    name: Build & Push images
    runs-on: ubuntu-latest
    needs: [lint_test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  staging:
    name: Deploy staging + healthcheck
    runs-on: ubuntu-latest
    needs: [build_push]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        working-directory: .
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=vitalsync
          POSTGRES_PASSWORD=vitalsync-pass
          POSTGRES_DB=vitalsync
          EOF

      - name: Start stack (compose)
        working-directory: .
        run: docker compose up --build -d

      - name: Healthcheck backend (fail if not OK)
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health >/dev/null; then
              echo "Healthcheck OK"
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck FAILED"
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Stop stack
        if: always()
        working-directory: .
        run: docker compose down -v

